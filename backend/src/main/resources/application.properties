# ----------------------------------------------------
# APPLICATION
# ----------------------------------------------------
spring.application.name=hiveSpace

# ----------------------------------------------------
# SERVER
# ----------------------------------------------------
server.port=${PORT:8080}

# ----------------------------------------------------
# POSTGRESQL DATABASE
# ----------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hivespace_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------
# HIKARI CONNECTION POOL
# ----------------------------------------------------
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# PgBouncer Fix
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ----------------------------------------------------
# JPA / HIBERNATE
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------------------
# ANSI COLORS
# ----------------------------------------------------
spring.output.ansi.enabled=ALWAYS

# ----------------------------------------------------
# CLEANER LOGGING
# ----------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=DEBUG

logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n

# ----------------------------------------------------
# JWT
# ----------------------------------------------------
jwt.secret=${JWT_SECRET:3a2f8b5c90d41e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f}

# ----------------------------------------------------
# GITHUB OAUTH
# ----------------------------------------------------
GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:placeholder}
GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:placeholder}

# ----------------------------------------------------
# SUPABASE
# ----------------------------------------------------
SUPABASE_URL=${SUPABASE_URL:placeholder}
SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:placeholder}