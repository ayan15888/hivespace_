# ----------------------------------------------------
# APPLICATION
# ----------------------------------------------------
spring.application.name=hiveSpace

# ----------------------------------------------------
# SERVER
# ----------------------------------------------------
server.port=${PORT:8080}

# ----------------------------------------------------
# POSTGRESQL DATABASE
# ----------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hivespace_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------
# HIKARI CONNECTION POOL
# ----------------------------------------------------
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# PgBouncer Fix
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ----------------------------------------------------
# JPA / HIBERNATE
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------------------
# ANSI COLORS
# ----------------------------------------------------
spring.output.ansi.enabled=ALWAYS

# ----------------------------------------------------
# CLEANER LOGGING
# ----------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=DEBUG

logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n

# ----------------------------------------------------
# JWT
# ----------------------------------------------------
jwt.secret=${JWT_SECRET:3a2f8b5c90d41e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f}

# ----------------------------------------------------
# GITHUB OAUTH
# ----------------------------------------------------
GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:placeholder}
GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:placeholder}

# ----------------------------------------------------
# SUPABASE
# ----------------------------------------------------
SUPABASE_URL=${SUPABASE_URL:placeholder}
SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:placeholder}

# ----------------------------------------------------
# AI FEATURES (NVIDIA NIM)
# ----------------------------------------------------
nvidia.api.url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
nvidia.api.key=${NVIDIA_API_KEY}
nvidia.model.default=${DEFAULT_CHAT_MODEL:meta/llama-3.3-70b-instruct}
nvidia.model.agentic=${AGENTIC_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
nvidia.model.fast=${FAST_MODEL:meta/llama-3.1-8b-instruct}
nvidia.model.embedding=${EMBEDDING_MODEL:nvidia/nv-embedcode-7b-v1}
nvidia.model.rerank=${RERANK_MODEL:nv-rerank-qa-mistral-4b:1}
nvidia.model.validation=${VALIDATION_MODEL:nvidia/nemotron-3.5-content-safety}
nvidia.url.rerank=${NVIDIA_RERANK_URL:https://ai.api.nvidia.com/v1/retrieval/nvidia/reranking}
nvidia.url.validation=${NVIDIA_VALIDATION_URL:https://integrate.api.nvidia.com/v1/chat/completions}
nvidia.model.redesign=${REDESIGN_MODEL:moonshotai/kimi-k2.6}

# ----------------------------------------------------
# AI FEATURES (KIMI / MOONSHOT AI)
# ----------------------------------------------------
kimi.api.url=${KIMI_BASE_URL:https://api.moonshot.cn/v1}
kimi.api.key=${KIMI_API_KEY}
kimi.model.default=${KIMI_MODEL:moonshot-v1-8k}

# Upstash Redis
upstash.redis.url=${UPSTASH_REDIS_REST_URL}
upstash.redis.token=${UPSTASH_REDIS_REST_TOKEN}